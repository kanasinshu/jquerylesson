<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
    $(function() {
      //初期画面
      const firstHtml =
      `
          <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
      `;
      // 「捕まえる」失敗時の画面表示
      const failHtml =
      `
        <p class="text">逃げられてしまった...</p>
        <button class="btn mt" data-js="reset">戻る</button>
      `;

      // 「ポケモンを探す」後のポケモン表示画面
      let encountHtml =
      `
        <p class="name"></p>
        <div>
          <img class="img" src="" alt="">
        </div>
        <div>
          <button class="btn" id="catch">捕まえる</button>
          <button class="btn" data-js="reset">逃げる</button>
        </div>
      `;

      // 「捕まえる」成功時のモンスターボール表示画面
      let doneHtml =
      `
        <p class="name">ゲットしました</p>
        <div>
          <img class="img" src="" alt="">
        </div>
        <button class="btn" data-js="reset">戻る</button>
      `;
      //ポケモンを探すクリックした時の挙動
      $(document).on('click', '#pokemon_search', function() {
        let pokemonId = Math.floor(Math.random() * 151) + 1;

        $.ajax({
          url: 'https://pokeapi.co/api/v2/pokemon/' + pokemonId,
          method: 'GET'
        }).done(function(res) {
          //通信成功時できた時の処理内容　今回だとポケモンが現れる処理
          $.ajax({
            url: res.species.url,
            method: 'GET'
          }).done(function(res2) {
            const jaName = res2.names.find(name => name.language.name === "ja").name;
            $('.wrapper').html(encountHtml);
            $('.name').text(jaName);
            $('.img').attr('src', res.sprites.front_default);
          }).fail(function(err2) {
            $('.wrapper').html(failHtml);
          })

        }).fail(function(err) {
          $('.wrapper').html(failHtml);
        });
      });
      //現れた後、捕まえる時の挙動
      $(document).on('click', '#catch', function() {
        $.ajax({
          url: 'https://pokeapi.co/api/v2/item/4',
          method: 'GET'
        }).done(function(res) {
          //50%の確率でゲット成功・失敗の条件分岐
          if (Math.random() < 0.5) {
            $('#wrapper').html(doneHtml);
            $('.img').attr('src', res.sprites.default);
          } else {
            $('#wrapper').html(failHtml);
          }
        })
        //通信失敗時の挙動
        .fail(function(err) {
          $('#wrapper').html(failHtml);
        });
      });

      //戻るボタン
      $(document).on('click', '[data-js="reset"]', function() {
          $('#wrapper').html(firstHtml);
      })
    });
      // モンスターの取得
// 'https://pokeapi.co/api/v2/pokemon/1'

// // モンスターボールの取得ß
// 'https://pokeapi.co/api/v2/item/4'
  </script>
</body>
</html>
